<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Paste Helper</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Copy-Paste Helper</h1>
        <p>Using the Clipboard API</p>

        <textarea id="textArea" placeholder="Type/Paste text here..."></textarea>

        <div class="buttons">
            <button id="copyBtn">Copy Text</button>
            <button id="pasteBtn">Paste Text</button>
        </div>

        <span id="status"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
